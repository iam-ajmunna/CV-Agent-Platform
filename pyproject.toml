[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-agent"
version = "0.1.0"
description = "CV Engineering Agent — autonomous Computer Vision engineering assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2,<2",
    "pydantic>=2.0,<3",
    "tomli>=2.0; python_version < '3.11'",
    "typing_extensions>=4.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
    "mypy>=1.17",
    "setuptools>=83.0.0",
]

[project.scripts]
cv-agent = "cv_agent.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
required-version = ">=0.16,<0.17"

[tool.ruff.lint.isort]
known-first-party = ["cv_agent"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.hatch.build.targets.wheel]
packages = ["cv_agent"]
include = ["cv_agent/resources/**"]

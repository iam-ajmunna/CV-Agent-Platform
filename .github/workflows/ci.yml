name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: >-
          ruff format --check .
          --exclude 'cv_agent/__main__.py'
          --exclude 'cv_agent/capabilities/registry.py'
          --exclude 'cv_agent/config/settings.py'
          --exclude 'cv_agent/llm/registry.py'
          --exclude 'docs/architecture/adr/ADR-0001-capability-model.md'
          --exclude 'tests/test_capabilities.py'
          --exclude 'tests/test_package_resources.py'

      - name: Mypy
        run: mypy cv_agent

      - name: Tests
        run: pytest -q

      - name: Build package
        run: python -m pip install build && python -m build

      - name: Dependency audit
        run: python -m pip install pip-audit && pip-audit
